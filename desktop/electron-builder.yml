# One config for every flavor in flavors.json (production, staging, change builds), each
# with its own identity, URL scheme, Electron profile, backend data, and update channel, so
# they install and run next to each other. scripts/flavor.mjs renders it with a flavor's
# RDST_DESKTOP_* values into build/<flavor>/electron-builder.yml, which builds pass to --config.
appId: "${RDST_DESKTOP_APP_ID}"
productName: "${RDST_DESKTOP_PRODUCT_NAME}"
protocols:
  - name: "${RDST_DESKTOP_PRODUCT_NAME}"
    schemes:
      - "${RDST_DESKTOP_SCHEME}"
directories:
  buildResources: resources
  output: "dist/${RDST_DESKTOP_FLAVOR}"
files:
  - out/**/*
  - node_modules/**/*
# Packaged package.json: name is the Electron profile (userData, single-instance lock),
# desktopName is Electron's Linux app_id, and the shell reads its instance from rdstInstance.
extraMetadata:
  name: "${RDST_DESKTOP_NAME}"
  desktopName: "${RDST_DESKTOP_NAME}.desktop"
  rdstInstance: "${RDST_DESKTOP_INSTANCE}"
extraFiles:
  - from: "sidecar/${os}-${arch}"
    to: "sidecar"
    filter:
      - "**/*"
  # Tells a directly launched sidecar which build it is.
  - from: "${RDST_DESKTOP_MARKER}"
    to: sidecar/rdst/instance.json
# Tray state icons (problem, paused, offline) are drawn at runtime from these two.
extraResources:
  - from: resources/tray.png
    to: icons/tray.png
  - from: resources/iconTemplate.png
    to: icons/iconTemplate.png
# Each platform's publish feed is the flavor's own update channel, the one updateFeedUrl in
# src/main/update-policy.ts checks.
mac:
  artifactName: "${RDST_DESKTOP_NAME}-${version}-${arch}.${ext}"
  publish:
    - provider: generic
      url: "${RDST_DESKTOP_FEED}/macos/update"
  category: public.app-category.developer-tools
  # Alerts (not banners) by default, so a lost database stays on screen until dismissed.
  extendInfo:
    NSUserNotificationAlertStyle: alert
  target:
    - dmg
    - zip
  # Notarization requires the hardened runtime. Signing credentials come
  # from the environment (CSC_LINK/CSC_KEY_PASSWORD). Notarization is
  # handled outside electron-builder: the CI build script submits the dmg
  # asynchronously and a separate pipeline step polls Apple's verdict, so
  # the build never blocks on the notary queue.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
# Uninstalling removes the app's data too (resources/installer.nsh adds the sidecar's data,
# Credential Manager entries and the start-at-login value). An update keeps all of it:
# the updater runs the old uninstaller with --updated, which both deletions check.
nsis:
  include: resources/installer.nsh
  deleteAppDataOnUninstall: true
win:
  artifactName: "${RDST_DESKTOP_NAME}-${version}-${arch}.${ext}"
  publish:
    - provider: generic
      url: "${RDST_DESKTOP_FEED}/windows/update"
  extraResources:
    - from: resources/uninstall-cleanup.ps1
      to: uninstall-cleanup.ps1
  target:
    - target: nsis
      arch:
        - x64
linux:
  artifactName: "${RDST_DESKTOP_NAME}-${version}-${arch}.${ext}"
  # Notifications (libnotify's desktop-entry hint) and window grouping find the app through
  # its .desktop file: desktopName is Electron's app_id and WM_CLASS, and the installed entry
  # is named after executableName, so they agree.
  executableName: "${RDST_DESKTOP_NAME}"
  publish:
    - provider: generic
      url: "${RDST_DESKTOP_FEED}/linux/update"
  category: Development
  desktop:
    entry:
      Comment: Watches your databases and tells you when a query starts hurting
      StartupNotify: "true"
  target:
    - AppImage
    - deb
    - rpm
# electron-builder's default depends lists plus ALSA: the Electron binary
# links libasound.so.2 at load time, so a stock install without it fails
# to launch. Overriding depends replaces the defaults, hence the full list.
# The ALSA dep is versioned so apt must pick a real alsa-lib (libasound2 or
# the versioned-Provides libasound2t64), never the liboss4-salsa stub whose
# unversioned Provides also claims libasound2.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - "libasound2 (>= 1.0.17)"
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - "(libXtst or libXtst6)"
    - xdg-utils
    - at-spi2-core
    - "(libuuid or libuuid1)"
    - alsa-lib
