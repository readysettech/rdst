appId: com.readyset.rdst-desktop
productName: RDST Desktop
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - node_modules/**/*
asarUnpack:
  - node_modules/electron-liquid-glass/prebuilds/**/*.node
extraFiles:
  - from: "sidecar/${os}-${arch}"
    to: "sidecar"
    filter:
      - "**/*"
mac:
  artifactName: "rdst-desktop-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Update channel fed by main-branch CI builds; keep in sync with
  # UPDATE_FEED_URLS in src/main/update-policy.ts.
  publish:
    - provider: generic
      url: https://downloads.readyset.io/packages/rdst-desktop/macos/update
win:
  target:
    - nsis
linux:
  artifactName: "rdst-desktop-${version}-${arch}.${ext}"
  category: Development
  target:
    - AppImage
    - deb
    - rpm
  publish:
    - provider: generic
      url: https://downloads.readyset.io/packages/rdst-desktop/linux/update
