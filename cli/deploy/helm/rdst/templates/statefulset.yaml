apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rdst.fullname" . }}
  labels:
    {{- include "rdst.labels" . | nindent 4 }}
spec:
  # One server per data volume: its stores, monitoring leases and account
  # session are single-writer.
  replicas: 1
  serviceName: {{ include "rdst.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "rdst.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rdst.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restarts the pod when the token set in values changes.
        rdst.readyset.io/auth-token: {{ .Values.auth.token | sha256sum | trunc 16 | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rdst.serviceAccountName" . }}
      automountServiceAccountToken: {{ or .Values.serviceAccount.automountToken .Values.discovery.kubernetes.enabled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: rdst
          image: {{ include "rdst.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: RDST_AUTH
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "token" }}
            - name: RDST_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rdst.authSecretName" . }}
                  key: {{ include "rdst.authSecretKey" . }}
            # Lets the sign-in page and log show the exact command to read the token.
            - name: RDST_AUTH_SECRET
              value: {{ include "rdst.authSecretName" . | quote }}
            - name: RDST_AUTH_SECRET_KEY
              value: {{ include "rdst.authSecretKey" . | quote }}
            - name: RDST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.notifications.slack.existingSecret }}
            - name: RDST_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.notifications.slack.existingSecretKey }}
            {{- end }}
            {{- with include "rdst.publicUrl" . }}
            - name: RDST_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.keyserviceUrl }}
            - name: RDST_KEYSERVICE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.discovery.kubernetes.namespaces }}
            - name: RDST_KUBERNETES_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if not .Values.telemetry.enabled }}
            - name: RDST_TELEMETRY
              value: "false"
            {{- end }}
            {{- if .Values.targets }}
            {{- range .Values.targets }}
            {{- if .passwordSecret }}
            - name: {{ include "rdst.targetPasswordEnv" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "each target's passwordSecret needs a name" .passwordSecret.name }}
                  key: {{ .passwordSecret.key | default "password" }}
            {{- end }}
            {{- end }}
            - name: RDST_SEED_TARGETS
              value: {{ include "rdst.seedTargets" . | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rdst.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
