{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rdst.fullname" . }}
  labels:
    {{- include "rdst.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rdst.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range .Values.networkPolicy.databases }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.discovery.kubernetes.enabled }}
    # The Kubernetes API, for "Search this cluster".
    - ports:
        {{- range .Values.discovery.kubernetes.apiServerPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
      {{- with .Values.discovery.kubernetes.apiServerCidrs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - {port: 443, protocol: TCP}
    {{- end }}
{{- end }}
