{{- if and (eq .Values.auth.mode "token") (not .Values.auth.existingSecret) }}
{{- $name := include "rdst.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.auth.token }}
{{- if not $token }}
{{- if and $existing (index $existing.data "access-token") }}
{{- $token = index $existing.data "access-token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 43 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rdst.labels" . | nindent 4 }}
  annotations:
    # Survives helm uninstall, like the data volume, so a reinstall keeps the token.
    helm.sh/resource-policy: keep
type: Opaque
data:
  access-token: {{ $token | b64enc | quote }}
{{- end }}
