apiVersion: v1
kind: Service
metadata:
  name: {{ include "rdst.fullname" . }}
  labels:
    {{- include "rdst.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rdst.selectorLabels" . | nindent 4 }}
---
# Stable network identity for the StatefulSet's single pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rdst.fullname" . }}-headless
  labels:
    {{- include "rdst.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "rdst.selectorLabels" . | nindent 4 }}
